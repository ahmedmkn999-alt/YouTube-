<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
:root {
  --accent:#e8c97a; --accent-dim:rgba(232,201,122,0.15); --accent-mid:rgba(232,201,122,0.35);
  --text:#f0ece0; --muted:rgba(240,236,224,0.45); --bar-bg:rgba(255,255,255,0.12);
  --panel-bg:rgba(10,10,14,0.92);
}
html,body {
  width:100%; height:100%; background:#050608;
  display:flex; align-items:center; justify-content:center;
  font-family:'Tajawal',sans-serif; overflow:hidden;
}
.shell {
  width:min(960px,100vw); aspect-ratio:16/9;
  position:relative; border-radius:14px; overflow:hidden; background:#000;
  box-shadow:0 0 0 1px rgba(232,201,122,0.12), 0 40px 120px rgba(0,0,0,0.9);
}
#yt {
  position:absolute; top:-75px; left:-1px;
  width:calc(100% + 2px); height:calc(100% + 150px);
  border:none; z-index:1;
}
.mask { position:absolute; z-index:6; pointer-events:none; background:#000; }
.mask-top    { top:0; left:0; right:0; height:75px; }
.mask-bottom { bottom:0; left:0; right:0; height:75px; }
.grad-top { position:absolute; top:0; left:0; right:0; height:90px; z-index:7; pointer-events:none;
  background:linear-gradient(to bottom,rgba(0,0,0,0.65),transparent); }
.grad-bot { position:absolute; bottom:0; left:0; right:0; height:170px; z-index:7; pointer-events:none;
  background:linear-gradient(to top,rgba(0,0,0,0.95),transparent); }
.interceptor { position:absolute; inset:0; z-index:8; cursor:pointer; }

/* Poster */
.poster {
  position:absolute; inset:0; z-index:9;
  background:#000 center/cover no-repeat;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:opacity 0.45s;
}
.poster::before {
  content:''; position:absolute; inset:0;
  background:linear-gradient(to top,rgba(0,0,0,0.75) 0%,rgba(0,0,0,0.15) 55%,rgba(0,0,0,0.45) 100%);
}
.poster-btn {
  position:relative; width:82px; height:82px; border-radius:50%;
  background:rgba(232,201,122,0.12); border:2px solid rgba(232,201,122,0.55);
  display:flex; align-items:center; justify-content:center;
  backdrop-filter:blur(6px); transition:transform 0.25s, background 0.25s;
}
.poster:hover .poster-btn { transform:scale(1.1); background:rgba(232,201,122,0.25); }
.poster-btn svg { width:36px; height:36px; fill:var(--accent); margin-right:-3px; }
.poster.gone { opacity:0; pointer-events:none; }

/* Center ripple */
.cp { position:absolute; inset:0; z-index:9; display:flex; align-items:center; justify-content:center; pointer-events:none; }
.rp {
  width:76px; height:76px; border-radius:50%;
  background:rgba(232,201,122,0.12); border:2px solid rgba(232,201,122,0.45);
  display:flex; align-items:center; justify-content:center;
  opacity:0; transform:scale(0.5); transition:opacity 0.2s, transform 0.2s; backdrop-filter:blur(4px);
}
.rp.show { opacity:1; transform:scale(1); }
.rp svg { width:30px; height:30px; fill:var(--accent); }

/* Settings panel */
.settings-panel {
  position:absolute; bottom:72px; right:14px; z-index:10;
  background:var(--panel-bg); backdrop-filter:blur(16px);
  border:1px solid rgba(232,201,122,0.18); border-radius:12px;
  padding:14px 16px; min-width:235px;
  display:flex; flex-direction:column; gap:14px;
  opacity:0; transform:translateY(6px) scale(0.97);
  pointer-events:none; transition:opacity 0.22s, transform 0.22s;
}
.settings-panel.open { opacity:1; transform:none; pointer-events:auto; }
.sp-section { display:flex; flex-direction:column; gap:7px; }
.sp-label { font-size:0.7rem; color:var(--muted); letter-spacing:1.5px; direction:rtl; }
.sp-opts { display:flex; gap:5px; flex-wrap:wrap; direction:ltr; }
.opt-btn {
  background:var(--bar-bg); border:1px solid rgba(255,255,255,0.08);
  color:var(--text); border-radius:6px; padding:4px 9px;
  font-family:'Tajawal',sans-serif; font-size:0.73rem; cursor:pointer;
  transition:all 0.15s; line-height:1.4;
}
.opt-btn:hover { background:var(--accent-dim); border-color:var(--accent-mid); color:var(--accent); }
.opt-btn.active { background:var(--accent-dim); border-color:var(--accent); color:var(--accent); font-weight:700; }

/* Controls */
.controls {
  position:absolute; bottom:0; left:0; right:0; z-index:10;
  padding:0 16px 16px;
  display:flex; flex-direction:column; gap:9px;
  transition:opacity 0.4s, transform 0.4s;
}
.controls.hidden { opacity:0; transform:translateY(8px); pointer-events:none; }
.prog-wrap {
  height:4px; background:var(--bar-bg); border-radius:99px;
  cursor:pointer; transition:height 0.2s; position:relative; direction:ltr;
}
.prog-wrap:hover { height:7px; }
.prog-fill {
  height:100%; background:var(--accent); border-radius:99px;
  width:0%; pointer-events:none; position:relative; transition:width 0.15s linear;
}
.prog-fill::after {
  content:''; position:absolute; right:-6px; top:50%;
  transform:translateY(-50%) scale(0);
  width:13px; height:13px; background:var(--accent); border-radius:50%;
  box-shadow:0 0 10px var(--accent); transition:transform 0.2s;
}
.prog-wrap:hover .prog-fill::after { transform:translateY(-50%) scale(1); }
.btn-row { display:flex; align-items:center; gap:3px; direction:ltr; }
.cb {
  background:none; border:none; color:var(--text); cursor:pointer;
  padding:7px; border-radius:8px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  transition:background 0.15s, transform 0.15s, color 0.15s; line-height:0;
}
.cb:hover  { background:var(--accent-dim); color:var(--accent); transform:scale(1.1); }
.cb:active { transform:scale(0.9); }
.cb svg    { width:22px; height:22px; fill:currentColor; pointer-events:none; }
.cb.lg svg { width:27px; height:27px; }
.t { font-size:0.78rem; color:var(--muted); direction:ltr; white-space:nowrap; padding:0 5px; font-variant-numeric:tabular-nums; flex-shrink:0; }
.vol-row { display:flex; align-items:center; gap:5px; }
.vsl {
  -webkit-appearance:none; appearance:none;
  width:70px; height:4px; background:var(--bar-bg); border-radius:99px;
  outline:none; cursor:pointer; direction:ltr;
}
.vsl::-webkit-slider-thumb {
  -webkit-appearance:none; width:13px; height:13px;
  background:var(--accent); border-radius:50%; box-shadow:0 0 6px var(--accent);
}
.spacer { flex:1; }
.qb {
  font-size:0.65rem; font-weight:700; letter-spacing:1px; color:var(--accent);
  border:1px solid rgba(232,201,122,0.3); border-radius:5px; padding:2px 6px;
  background:var(--accent-dim); flex-shrink:0;
}

/* Spinner */
.spn { position:absolute; inset:0; z-index:11; display:flex; align-items:center; justify-content:center; pointer-events:none; }
.spn.gone { display:none; }
.sr { width:44px; height:44px; border:3px solid rgba(232,201,122,0.12); border-top-color:var(--accent); border-radius:50%; animation:spin 0.85s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* Error */
.err-box {
  display:none; position:absolute; inset:0; z-index:12;
  background:rgba(0,0,0,0.9); flex-direction:column; align-items:center; justify-content:center;
  gap:14px; text-align:center; padding:30px;
}
.err-box.show { display:flex; }
.err-icon  { font-size:2.5rem; }
.err-title { color:var(--accent); font-size:1.1rem; font-weight:700; }
.err-sub   { color:var(--muted); font-size:0.85rem; line-height:1.6; }
.err-link  {
  color:var(--accent); font-size:0.85rem; text-decoration:none;
  border:1px solid rgba(232,201,122,0.4); border-radius:8px; padding:8px 18px;
  transition:background 0.2s;
}
.err-link:hover { background:var(--accent-dim); }

/* Mobile */
@media(max-width:600px){
  .shell { border-radius:0; }
  .vsl { width:48px; }
  .cb svg { width:19px; height:19px; }
  .cb.lg svg { width:23px; height:23px; }
  .qb { display:none; }
  #yt { top:-55px; height:calc(100% + 110px); }
  .mask-top { height:55px; }
  .mask-bottom { height:55px; }
  .settings-panel { right:8px; min-width:210px; }
  .t { font-size:0.72rem; }
}

/* ── FIX: Fullscreen landscape on mobile ── */
:fullscreen .shell,
:-webkit-full-screen .shell,
:-moz-full-screen .shell {
  width: 100vw !important;
  height: 100vh !important;
  aspect-ratio: unset !important;
  border-radius: 0 !important;
}
:fullscreen,
:-webkit-full-screen,
:-moz-full-screen {
  background: #000;
  width: 100%;
  height: 100%;
}
</style>
</head>
<body>
<div class="shell" id="shell">

  <!-- FIX: أضفنا origin و widget_referrer لمنع مشاكل التحميل -->
  <iframe id="yt"
    src="https://www.youtube-nocookie.com/embed/aqz-KE-bpKQ?enablejsapi=1&autoplay=0&controls=0&rel=0&modestbranding=1&iv_load_policy=3&disablekb=1&fs=0&playsinline=1&widget_referrer=https://localhost"
    allow="autoplay; encrypted-media; fullscreen; accelerometer; gyroscope"
    allowfullscreen></iframe>

  <div class="mask mask-top"></div>
  <div class="mask mask-bottom"></div>
  <div class="grad-top"></div>
  <div class="grad-bot"></div>

  <div class="poster" id="poster"
       style="background-image:url('https://img.youtube.com/vi/aqz-KE-bpKQ/maxresdefault.jpg')">
    <div class="poster-btn">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </div>
  </div>

  <!-- FIX: الـ spinner هيختفي تلقائياً بعد 8 ثواني لو اليوتيوب API مش بيرد -->
  <div class="spn" id="spn"><div class="sr"></div></div>

  <div class="err-box" id="errBox">
    <div class="err-icon">⚠️</div>
    <div class="err-title">الفيديو مش بيتشغلش من هنا</div>
    <div class="err-sub">صاحب الفيديو منع تشغيله خارج يوتيوب</div>
    <a class="err-link" href="https://youtu.be/aqz-KE-bpKQ" target="_blank">افتح على يوتيوب ↗</a>
  </div>

  <div class="cp"><div class="rp" id="rp"><svg id="ri" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div>
  <div class="interceptor" id="icp"></div>

  <!-- Settings panel -->
  <div class="settings-panel" id="settingsPanel">
    <div class="sp-section">
      <div class="sp-label">السرعة</div>
      <div class="sp-opts" id="speedOpts">
        <button class="opt-btn" data-speed="0.5">0.5×</button>
        <button class="opt-btn" data-speed="0.75">0.75×</button>
        <button class="opt-btn active" data-speed="1">1×</button>
        <button class="opt-btn" data-speed="1.25">1.25×</button>
        <button class="opt-btn" data-speed="1.5">1.5×</button>
        <button class="opt-btn" data-speed="2">2×</button>
      </div>
    </div>
    <div class="sp-section">
      <div class="sp-label">الجودة</div>
      <div class="sp-opts" id="qualOpts">
        <button class="opt-btn active" data-qual="default">تلقائي</button>
        <button class="opt-btn" data-qual="medium">360p</button>
        <button class="opt-btn" data-qual="large">480p</button>
        <button class="opt-btn" data-qual="hd720">720p</button>
        <button class="opt-btn" data-qual="hd1080">1080p</button>
      </div>
    </div>
  </div>

  <div class="controls" id="ctrl">
    <div class="prog-wrap" id="pw"><div class="prog-fill" id="pf"></div></div>
    <div class="btn-row">
      <button class="cb lg" id="pb"><svg id="pi" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="cb" id="bb">
        <svg viewBox="0 0 24 24">
          <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
          <text x="12" y="14.5" font-size="4.5" fill="currentColor" text-anchor="middle">10</text>
        </svg>
      </button>
      <button class="cb" id="fb">
        <svg viewBox="0 0 24 24">
          <path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/>
          <text x="12" y="14.5" font-size="4.5" fill="currentColor" text-anchor="middle">10</text>
        </svg>
      </button>
      <div class="vol-row">
        <button class="cb" id="mb"><svg id="vi" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg></button>
        <input type="range" class="vsl" id="vs" min="0" max="100" value="80">
      </div>
      <span class="t" id="tt">0:00 / 0:00</span>
      <span class="spacer"></span>
      <button class="cb" id="stb" title="الإعدادات">
        <svg viewBox="0 0 24 24">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
      </button>
      <span class="qb" id="qbLabel">HD</span>
      <button class="cb" id="fs"><svg id="fi" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></button>
    </div>
  </div>
</div>

<script>
const g = id => document.getElementById(id);
const shell=g('shell'), ctrl=g('ctrl'), pw=g('pw'), pf=g('pf'),
      pb=g('pb'), pi=g('pi'), rp=g('rp'), ri=g('ri'),
      tt=g('tt'), vs=g('vs'), mb=g('mb'), vi=g('vi'),
      fs=g('fs'), fi=g('fi'), spn=g('spn'), icp=g('icp'),
      bb=g('bb'), fb=g('fb'), errBox=g('errBox'),
      poster=g('poster'), stb=g('stb'),
      settingsPanel=g('settingsPanel'), qbLabel=g('qbLabel');

let player, dur=0, playing=false, drag=false, hideT, isFS=false, pendingPlay=false;

const PL='M8 5v14l11-7z', PA='M6 19h4V5H6v14zm8-14v14h4V5h-4z';
const FI='M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z';
const FO='M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z';
const VO='M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z';
const VX='M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z';
const setP=(el,d)=>el.querySelector('path').setAttribute('d',d);

/* ── FIX: Spinner timeout - لو اليوتيوب API مش بيرد في 10 ثواني ── */
const spinnerTimeout = setTimeout(() => {
  if (!player) {
    spn.classList.add('gone');
    // لو اليوتيوب مش بيتحمل، ابقى على الـ poster بس
    poster.classList.remove('gone');
  }
}, 10000);

/* ── YouTube API ── */
window.onYouTubeIframeAPIReady = function(){
  player = new YT.Player('yt',{
    events:{
      onReady(e){
        clearTimeout(spinnerTimeout);
        e.target.setVolume(80);
        spn.classList.add('gone');
        if(pendingPlay){ pendingPlay=false; player.playVideo(); }
      },
      onStateChange(e){
        const S=YT.PlayerState;
        if(e.data===S.PLAYING){
          playing=true; dur=player.getDuration();
          setP(pi,PA); setP(ri,PA);
          spn.classList.add('gone');
          errBox.classList.remove('show');
          poster.classList.add('gone');
        } else if(e.data===S.PAUSED||e.data===S.ENDED){
          playing=false; setP(pi,PL); setP(ri,PL);
          spn.classList.add('gone'); // FIX: أخفي الـ spinner لما يوقف
        } else if(e.data===S.BUFFERING){
          spn.classList.remove('gone');
        } else if(e.data===S.CUED){
          spn.classList.add('gone'); // FIX: لو الفيديو جاهز بس مش بيتشغل
        }
      },
      onError(e){
        clearTimeout(spinnerTimeout);
        spn.classList.add('gone');
        errBox.classList.add('show');
      }
    }
  });
};

/* ── FIX: لو اليوتيوب iframe مش بيتحمل خالص ── */
g('yt').addEventListener('error', () => {
  clearTimeout(spinnerTimeout);
  spn.classList.add('gone');
  errBox.classList.add('show');
});

/* ── تحديث الوقت ── */
setInterval(()=>{
  if(!player||!player.getCurrentTime||drag)return;
  const ct=player.getCurrentTime()||0;
  dur=player.getDuration()||0;
  if(dur>0) pf.style.width=(ct/dur*100)+'%';
  tt.textContent=fmt(ct)+' / '+fmt(dur);
},300);
function fmt(s){ s=Math.floor(s); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

/* ── Play/Pause ── */
function toggle(){
  if(!player){ pendingPlay=true; return; }
  playing?player.pauseVideo():player.playVideo();
  flash();
}
function flash(){ rp.classList.add('show'); setTimeout(()=>rp.classList.remove('show'),500); }

poster.addEventListener('click',toggle);
icp.addEventListener('click',toggle);
pb.addEventListener('click',toggle);
bb.addEventListener('click',()=>{ if(player) player.seekTo(Math.max(0,player.getCurrentTime()-10),true); });
fb.addEventListener('click',()=>{ if(player) player.seekTo(player.getCurrentTime()+10,true); });

/* ── Progress bar ── */
function doSeek(x){
  const r=pw.getBoundingClientRect(),p=Math.max(0,Math.min(1,(x-r.left)/r.width));
  pf.style.width=(p*100)+'%';
  if(player&&dur)player.seekTo(p*dur,true);
}
pw.addEventListener('mousedown',e=>{drag=true;doSeek(e.clientX);});
document.addEventListener('mousemove',e=>{if(drag)doSeek(e.clientX);});
document.addEventListener('mouseup',()=>{drag=false;});
pw.addEventListener('touchstart',e=>{drag=true;doSeek(e.touches[0].clientX);},{passive:true});
document.addEventListener('touchmove',e=>{if(drag)doSeek(e.touches[0].clientX);},{passive:true});
document.addEventListener('touchend',()=>{drag=false;});

/* ── Volume ── */
vs.addEventListener('input',()=>{if(player)player.setVolume(+vs.value);uv();});
mb.addEventListener('click',()=>{
  if(!player)return;
  player.isMuted()?(player.unMute(),vs.value=player.getVolume()):(player.mute(),vs.value=0);
  uv();
});
function uv(){setP(vi,(+vs.value===0||(player&&player.isMuted()))?VX:VO);}

/* ── Settings ── */
stb.addEventListener('click',e=>{e.stopPropagation();settingsPanel.classList.toggle('open');});
document.addEventListener('click',e=>{
  if(!settingsPanel.contains(e.target)&&e.target!==stb)
    settingsPanel.classList.remove('open');
});

/* Speed */
g('speedOpts').addEventListener('click',e=>{
  const btn=e.target.closest('.opt-btn'); if(!btn)return;
  const rate=parseFloat(btn.dataset.speed);
  if(player)player.setPlaybackRate(rate);
  document.querySelectorAll('#speedOpts .opt-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  qbLabel.textContent=rate===1?'HD':rate+'×';
});

/* Quality */
g('qualOpts').addEventListener('click',e=>{
  const btn=e.target.closest('.opt-btn'); if(!btn)return;
  const q=btn.dataset.qual;
  if(player){
    player.setPlaybackQuality(q);
    const ct=player.getCurrentTime();
    if(ct>0)player.seekTo(ct,true);
  }
  document.querySelectorAll('#qualOpts .opt-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
});

/* ── FIX: Fullscreen + Screen Orientation Lock (landscape على الموبايل) ── */
fs.addEventListener('click', async () => {
  if (!isFS) {
    try {
      // ادخل fullscreen
      const req = shell.requestFullscreen || shell.webkitRequestFullscreen || shell.mozRequestFullScreen;
      await req.call(shell);
      // لف الشاشة landscape على الموبايل
      if (screen.orientation && screen.orientation.lock) {
        try { await screen.orientation.lock('landscape'); } catch(e) { /* مش كل الأجهزة بتسمح */ }
      }
    } catch(e) {}
  } else {
    try {
      // اطلع من fullscreen
      const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen;
      await exit.call(document);
      // رجع orientation للـ natural
      if (screen.orientation && screen.orientation.unlock) {
        try { screen.orientation.unlock(); } catch(e) {}
      }
    } catch(e) {}
  }
});

['fullscreenchange','webkitfullscreenchange'].forEach(ev=>
  document.addEventListener(ev,()=>{
    isFS=!!(document.fullscreenElement||document.webkitFullscreenElement);
    setP(fi,isFS?FO:FI);
    // لو خرج من fullscreen بدون زرار، رجع الـ orientation
    if (!isFS && screen.orientation && screen.orientation.unlock) {
      try { screen.orientation.unlock(); } catch(e) {}
    }
  })
);

/* ── Controls auto-hide ── */
function showCtrl(){
  ctrl.classList.remove('hidden');
  clearTimeout(hideT);
  if(playing)hideT=setTimeout(()=>{
    ctrl.classList.add('hidden');
    settingsPanel.classList.remove('open');
  },3000);
}
shell.addEventListener('mousemove',showCtrl);
shell.addEventListener('touchstart',showCtrl,{passive:true});

/* ── Keyboard ── */
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();toggle();}
  if(e.code==='ArrowRight'){if(player)player.seekTo(player.getCurrentTime()+5,true);}
  if(e.code==='ArrowLeft'){if(player)player.seekTo(Math.max(0,player.getCurrentTime()-5),true);}
  if(e.code==='ArrowUp'){if(player){player.setVolume(Math.min(100,player.getVolume()+10));vs.value=player.getVolume();uv();}}
  if(e.code==='ArrowDown'){if(player){player.setVolume(Math.max(0,player.getVolume()-10));vs.value=player.getVolume();uv();}}
  if(e.code==='KeyF')fs.click();
  if(e.code==='KeyM')mb.click();
});
</script>
