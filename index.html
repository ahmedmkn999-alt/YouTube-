<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Player</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
:root {
  --gold:#e8c97a; --gold-dim:rgba(232,201,122,0.15); --gold-mid:rgba(232,201,122,0.35);
  --text:#f0ece0; --muted:rgba(240,236,224,0.5); --bar:rgba(255,255,255,0.15);
  --panel:rgba(8,8,12,0.95);
}
html,body {
  width:100%;height:100%;background:#050608;
  display:flex;align-items:center;justify-content:center;
  font-family:'Tajawal',sans-serif;overflow:hidden;
}
.shell {
  position:relative;width:min(960px,100vw);aspect-ratio:16/9;
  background:#000;border-radius:12px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(232,201,122,0.1),0 30px 80px rgba(0,0,0,0.9);
}

/* ── iframe يملي الـ shell كامل ── */
#yt-wrap {
  position:absolute;top:-75px;left:-1px;
  width:calc(100% + 2px);height:calc(100% + 150px);
  z-index:1;background:#000;
  /* مهم: pointer-events مفتوح عشان الـ API يشتغل */
  pointer-events:auto;
}
#yt-wrap iframe { width:100%;height:100%;border:none;display:block; }

/* إخفاء شريط يوتيوب */
.mask { position:absolute;z-index:2;left:0;right:0;background:#000;pointer-events:none; }
.mask-top    { top:0;height:76px; }
.mask-bottom { bottom:0;height:76px; }

/* ── Poster: فوق كل حاجة في البداية، بتختفي بعد أول play ── */
#poster {
  position:absolute;inset:0;z-index:10;
  background:#000 center/cover no-repeat;
  cursor:pointer;transition:opacity 0.4s;
  display:flex;align-items:center;justify-content:center;
}
#poster .play-btn {
  width:80px;height:80px;border-radius:50%;
  background:rgba(232,201,122,0.15);border:2px solid rgba(232,201,122,0.6);
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(6px);transition:transform 0.2s,background 0.2s;
  pointer-events:none;
}
#poster:active .play-btn { transform:scale(0.92); }
#poster .play-btn svg { width:34px;height:34px;fill:var(--gold);margin-right:-3px; }
#poster.gone { opacity:0;pointer-events:none; }

/* ── Spinner ── */
#spinner {
  position:absolute;inset:0;z-index:9;
  display:flex;align-items:center;justify-content:center;pointer-events:none;
}
#spinner.gone { display:none; }
.ring { width:48px;height:48px;border:3px solid rgba(232,201,122,0.12);border-top-color:var(--gold);border-radius:50%;animation:spin 0.9s linear infinite; }
@keyframes spin { to{transform:rotate(360deg);} }

/* ── Error ── */
#err {
  position:absolute;inset:0;z-index:11;background:rgba(0,0,0,0.92);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;text-align:center;padding:24px;
}
#err.show { display:flex; }
#err .icon  { font-size:2.5rem; }
#err .title { color:var(--gold);font-size:1.1rem;font-weight:700; }
#err .sub   { color:var(--muted);font-size:0.85rem;line-height:1.7; }
#err a { color:var(--gold);font-size:0.85rem;text-decoration:none;border:1px solid rgba(232,201,122,0.4);border-radius:8px;padding:8px 20px; }

/* ── Seek flash ── */
.sf {
  position:absolute;top:50%;z-index:9;transform:translateY(-50%);
  background:rgba(0,0,0,0.45);backdrop-filter:blur(4px);
  border-radius:50%;width:68px;height:68px;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity 0.18s;
}
.sf.L { left:10%; } .sf.R { right:10%; }
.sf.on { opacity:1; }
.sf svg { width:28px;height:28px;fill:var(--gold); }

/* ── Controls ── */
#ctrl {
  position:absolute;bottom:0;left:0;right:0;z-index:8;
  padding:0 14px 14px;
  display:flex;flex-direction:column;gap:8px;
  background:linear-gradient(to top,rgba(0,0,0,0.92) 0%,transparent 100%);
  transition:opacity 0.35s,transform 0.35s;
  /* مهم: الكنترول يستقبل الضغط بس هو نفسه */
  pointer-events:auto;
}
#ctrl.off { opacity:0;transform:translateY(6px);pointer-events:none; }

/* Progress */
.prog-wrap {
  height:4px;background:var(--bar);border-radius:99px;
  cursor:pointer;position:relative;direction:ltr;transition:height 0.18s;
}
.prog-wrap:hover,.prog-wrap:active { height:7px; }
.prog-fill {
  height:100%;background:var(--gold);border-radius:99px;
  width:0%;pointer-events:none;position:relative;transition:width 0.15s linear;
}
.prog-fill::after {
  content:'';position:absolute;right:-6px;top:50%;
  transform:translateY(-50%) scale(0);
  width:13px;height:13px;background:var(--gold);border-radius:50%;
  box-shadow:0 0 8px var(--gold);transition:transform 0.2s;
}
.prog-wrap:hover .prog-fill::after,
.prog-wrap:active .prog-fill::after { transform:translateY(-50%) scale(1); }

/* Btn row */
.row { display:flex;align-items:center;gap:2px;direction:ltr; }
.cb {
  background:none;border:none;color:var(--text);padding:8px;border-radius:8px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:background 0.15s,color 0.15s;line-height:0;
}
.cb:hover { background:var(--gold-dim);color:var(--gold); }
.cb:active { opacity:0.7; }
.cb svg { width:22px;height:22px;fill:currentColor;pointer-events:none; }
.cb.lg svg { width:26px;height:26px; }
.sp { flex:1; }
.tlabel { font-size:0.76rem;color:var(--muted);direction:ltr;white-space:nowrap;padding:0 4px;flex-shrink:0;font-variant-numeric:tabular-nums; }
.volw { display:flex;align-items:center;gap:4px; }
.vsl { -webkit-appearance:none;appearance:none;width:64px;height:4px;background:var(--bar);border-radius:99px;outline:none;cursor:pointer;direction:ltr; }
.vsl::-webkit-slider-thumb { -webkit-appearance:none;width:13px;height:13px;background:var(--gold);border-radius:50%;box-shadow:0 0 5px var(--gold); }
.qb { font-size:0.62rem;font-weight:700;letter-spacing:1px;color:var(--gold);border:1px solid rgba(232,201,122,0.3);border-radius:5px;padding:2px 6px;background:var(--gold-dim);flex-shrink:0; }

/* Settings panel */
#sett {
  position:absolute;bottom:68px;right:12px;z-index:12;
  background:var(--panel);backdrop-filter:blur(18px);
  border:1px solid rgba(232,201,122,0.18);border-radius:12px;
  padding:14px 16px;min-width:230px;
  display:flex;flex-direction:column;gap:14px;
  opacity:0;transform:translateY(8px) scale(0.96);
  pointer-events:none;transition:opacity 0.2s,transform 0.2s;
}
#sett.open { opacity:1;transform:none;pointer-events:auto; }
.slbl { font-size:0.68rem;color:var(--muted);letter-spacing:1.5px;margin-bottom:5px;direction:rtl; }
.sopts { display:flex;gap:5px;flex-wrap:wrap;direction:ltr; }
.opt {
  background:var(--bar);border:1px solid rgba(255,255,255,0.08);color:var(--text);
  border-radius:6px;padding:4px 10px;font-family:'Tajawal',sans-serif;font-size:0.72rem;
  cursor:pointer;transition:all 0.15s;line-height:1.5;
}
.opt:hover { background:var(--gold-dim);border-color:var(--gold-mid);color:var(--gold); }
.opt.on { background:var(--gold-dim);border-color:var(--gold);color:var(--gold);font-weight:700; }

@media(max-width:600px){
  .shell{border-radius:0;}
  .vsl{width:46px;}
  .cb svg{width:19px;height:19px;}
  .cb.lg svg{width:23px;height:23px;}
  .qb{display:none;}
  #yt-wrap{top:-55px;height:calc(100% + 110px);}
  .mask-top{height:56px;}
  .mask-bottom{height:56px;}
  #sett{right:6px;min-width:210px;}
}
:fullscreen .shell,:-webkit-full-screen .shell {
  width:100vw!important;height:100vh!important;aspect-ratio:unset!important;border-radius:0!important;
}
</style>
</head>
<body>
<div class="shell" id="shell">

  <div id="yt-wrap"><div id="yt"></div></div>

  <div class="mask mask-top"></div>
  <div class="mask mask-bottom"></div>

  <!-- Poster: الضغط عليها يشغّل الفيديو وتختفي -->
  <div id="poster" style="background-image:url('https://img.youtube.com/vi/aqz-KE-bpKQ/maxresdefault.jpg')">
    <div class="play-btn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
  </div>

  <div id="spinner"><div class="ring"></div></div>

  <div id="err">
    <div class="icon">⚠️</div>
    <div class="title">الفيديو مش بيتشغلش</div>
    <div class="sub">صاحب الفيديو منع تشغيله خارج يوتيوب</div>
    <a href="https://youtu.be/aqz-KE-bpKQ" target="_blank">افتح على يوتيوب ↗</a>
  </div>

  <div class="sf L" id="sfL"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg></div>
  <div class="sf R" id="sfR"><svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/></svg></div>

  <!-- Settings -->
  <div id="sett">
    <div>
      <div class="slbl">السرعة</div>
      <div class="sopts" id="spd">
        <button class="opt" data-v="0.5">0.5×</button>
        <button class="opt" data-v="0.75">0.75×</button>
        <button class="opt on" data-v="1">1×</button>
        <button class="opt" data-v="1.25">1.25×</button>
        <button class="opt" data-v="1.5">1.5×</button>
        <button class="opt" data-v="2">2×</button>
      </div>
    </div>
    <div>
      <div class="slbl">الجودة</div>
      <div class="sopts" id="qlt">
        <button class="opt on" data-v="default">تلقائي</button>
        <button class="opt" data-v="medium">360p</button>
        <button class="opt" data-v="large">480p</button>
        <button class="opt" data-v="hd720">720p</button>
        <button class="opt" data-v="hd1080">1080p</button>
      </div>
    </div>
  </div>

  <!-- Controls -->
  <div id="ctrl">
    <div class="prog-wrap" id="prog"><div class="prog-fill" id="fill"></div></div>
    <div class="row">
      <button class="cb lg" id="bPlay"><svg viewBox="0 0 24 24"><path id="iPlay" d="M8 5v14l11-7z"/></svg></button>
      <button class="cb" id="bBack"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/><text x="12" y="14.5" font-size="4.5" fill="currentColor" text-anchor="middle" style="font-family:sans-serif">10</text></svg></button>
      <button class="cb" id="bFwd"><svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/><text x="12" y="14.5" font-size="4.5" fill="currentColor" text-anchor="middle" style="font-family:sans-serif">10</text></svg></button>
      <div class="volw">
        <button class="cb" id="bMute"><svg viewBox="0 0 24 24"><path id="iVol" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg></button>
        <input type="range" class="vsl" id="vsl" min="0" max="100" value="80">
      </div>
      <span class="tlabel" id="tlbl">0:00 / 0:00</span>
      <span class="sp"></span>
      <button class="cb" id="bSett"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></button>
      <span class="qb" id="qb">HD</span>
      <button class="cb" id="bFs"><svg viewBox="0 0 24 24"><path id="iFs" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></button>
    </div>
  </div>

</div>
<script>
const VID = 'aqz-KE-bpKQ';
let player=null, playing=false, dur=0, drag=false, isFS=false, hideT=null, ctrlOn=true, pending=false;

const $ = id => document.getElementById(id);
const shell=$('shell'), poster=$('poster'), spinner=$('spinner'), err=$('err');
const ctrl=$('ctrl'), prog=$('prog'), fill=$('fill'), tlbl=$('tlbl');
const iPlay=$('iPlay'), iVol=$('iVol'), iFs=$('iFs');
const vsl=$('vsl'), sett=$('sett'), qb=$('qb');
const sfL=$('sfL'), sfR=$('sfR');

const PL='M8 5v14l11-7z', PA='M6 19h4V5H6v14zm8-14v14h4V5h-4z';
const VU='M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z';
const VM='M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z';
const FI='M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z';
const FO='M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z';

// ── YouTube API ──
window.onYouTubeIframeAPIReady = function(){
  player = new YT.Player('yt',{
    videoId: VID,
    playerVars:{ autoplay:0, controls:0, rel:0, modestbranding:1, iv_load_policy:3, disablekb:1, fs:0, playsinline:1, origin:location.origin },
    events:{
      onReady(e){ e.target.setVolume(80); spinner.classList.add('gone'); if(pending){pending=false;player.playVideo();} },
      onStateChange(e){
        const S=YT.PlayerState;
        if(e.data===S.PLAYING){
          playing=true; dur=player.getDuration();
          iPlay.setAttribute('d',PA); spinner.classList.add('gone');
          err.classList.remove('show'); poster.classList.add('gone');
          schedHide();
        } else if(e.data===S.PAUSED||e.data===S.ENDED){
          playing=false; iPlay.setAttribute('d',PL); spinner.classList.add('gone'); showCtrl();
        } else if(e.data===S.BUFFERING){
          spinner.classList.remove('gone');
        }
      },
      onError(){ spinner.classList.add('gone'); err.classList.add('show'); }
    }
  });
};

// ── Play/Pause ──
function togglePlay(){
  if(!player){ pending=true; poster.classList.add('gone'); spinner.classList.remove('gone'); return; }
  poster.classList.add('gone');
  playing ? player.pauseVideo() : player.playVideo();
}

// ── Controls show/hide ──
function showCtrl(){ ctrl.classList.remove('off'); ctrlOn=true; clearTimeout(hideT); }
function schedHide(){ clearTimeout(hideT); hideT=setTimeout(()=>{ ctrl.classList.add('off'); sett.classList.remove('open'); ctrlOn=false; },3000); }
function showTemp(){ showCtrl(); if(playing) schedHide(); }

// ── Poster: أول ضغطة تشغّل وتختفي ──
poster.addEventListener('click', ()=>{ togglePlay(); showTemp(); });
poster.addEventListener('touchend', e=>{ e.preventDefault(); togglePlay(); showTemp(); },{passive:false});

// ── الضغط على الـ shell نفسه (فوق الـ iframe) لإظهار/إخفاء الكنترول ──
// نستخدم touchstart على الـ shell بس نتجاهل لو الضغط على الـ ctrl أو sett
let tapT=null, tapN=0, tapX=0;

shell.addEventListener('touchstart', e=>{
  // لو الضغط على ctrl أو sett أو poster، اتجاهل
  if(ctrl.contains(e.target)||sett.contains(e.target)||poster.contains(e.target)) return;
  tapN++;
  tapX = e.touches[0].clientX - shell.getBoundingClientRect().left;
  clearTimeout(tapT);
  tapT = setTimeout(()=>{
    if(tapN===1){
      // دوسة وحدة: إظهار/إخفاء كنترول
      ctrlOn ? (()=>{ ctrl.classList.add('off'); sett.classList.remove('open'); ctrlOn=false; clearTimeout(hideT); })() : showTemp();
    } else if(tapN>=2){
      // دوستين: seek
      const w=shell.offsetWidth;
      if(tapX > w*0.6){       player&&player.seekTo(player.getCurrentTime()+10,true); flash('R'); }
      else if(tapX < w*0.4){  player&&player.seekTo(Math.max(0,player.getCurrentTime()-10),true); flash('L'); }
      else { togglePlay(); }
    }
    tapN=0;
  },230);
},{passive:true});

function flash(d){ const el=d==='L'?sfL:sfR; el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),600); }

// ── Buttons ──
$('bPlay').addEventListener('click', e=>{ e.stopPropagation(); togglePlay(); showTemp(); });
$('bBack').addEventListener('click', e=>{ e.stopPropagation(); if(player)player.seekTo(Math.max(0,player.getCurrentTime()-10),true); flash('L'); showTemp(); });
$('bFwd' ).addEventListener('click', e=>{ e.stopPropagation(); if(player)player.seekTo(player.getCurrentTime()+10,true); flash('R'); showTemp(); });

// ── Progress ──
function seek(x){ const r=prog.getBoundingClientRect(),p=Math.max(0,Math.min(1,(x-r.left)/r.width)); fill.style.width=(p*100)+'%'; if(player&&dur)player.seekTo(p*dur,true); }
prog.addEventListener('mousedown',  e=>{ drag=true; seek(e.clientX); e.stopPropagation(); });
prog.addEventListener('touchstart', e=>{ drag=true; seek(e.touches[0].clientX); e.stopPropagation(); },{passive:true});
document.addEventListener('mousemove', e=>{ if(drag) seek(e.clientX); });
document.addEventListener('touchmove', e=>{ if(drag) seek(e.touches[0].clientX); },{passive:true});
document.addEventListener('mouseup',  ()=>{ drag=false; });
document.addEventListener('touchend', ()=>{ drag=false; });

setInterval(()=>{
  if(!player||!player.getCurrentTime||drag)return;
  const ct=player.getCurrentTime()||0; dur=player.getDuration()||0;
  if(dur>0) fill.style.width=(ct/dur*100)+'%';
  tlbl.textContent=fmt(ct)+' / '+fmt(dur);
},300);
function fmt(s){ s=Math.floor(s); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

// ── Volume ──
vsl.addEventListener('input', e=>{ e.stopPropagation(); if(player)player.setVolume(+vsl.value); updVol(); });
$('bMute').addEventListener('click', e=>{ e.stopPropagation(); if(!player)return; player.isMuted()?(player.unMute(),vsl.value=player.getVolume()):(player.mute(),vsl.value=0); updVol(); });
function updVol(){ iVol.setAttribute('d',(+vsl.value===0||(player&&player.isMuted()))?VM:VU); }

// ── Settings ──
$('bSett').addEventListener('click', e=>{ e.stopPropagation(); sett.classList.toggle('open'); showTemp(); });
document.addEventListener('click', e=>{ if(!sett.contains(e.target)&&e.target!==$('bSett')) sett.classList.remove('open'); });
$('spd').addEventListener('click', e=>{ const b=e.target.closest('.opt'); if(!b)return; if(player)player.setPlaybackRate(parseFloat(b.dataset.v)); $('spd').querySelectorAll('.opt').forEach(x=>x.classList.remove('on')); b.classList.add('on'); qb.textContent=b.dataset.v==='1'?'HD':b.dataset.v+'×'; });
$('qlt').addEventListener('click', e=>{ const b=e.target.closest('.opt'); if(!b)return; if(player){player.setPlaybackQuality(b.dataset.v); const ct=player.getCurrentTime(); if(ct>0)player.seekTo(ct,true);} $('qlt').querySelectorAll('.opt').forEach(x=>x.classList.remove('on')); b.classList.add('on'); });

// ── Fullscreen ──
$('bFs').addEventListener('click', async e=>{
  e.stopPropagation();
  if(!isFS){ try{ await (shell.requestFullscreen||shell.webkitRequestFullscreen).call(shell); screen.orientation?.lock('landscape').catch(()=>{}); }catch(x){} }
  else     { try{ await (document.exitFullscreen||document.webkitExitFullscreen).call(document); screen.orientation?.unlock?.(); }catch(x){} }
});
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{ isFS=!!(document.fullscreenElement||document.webkitFullscreenElement); iFs.setAttribute('d',isFS?FO:FI); if(!isFS)screen.orientation?.unlock?.(); }));

// ── Mouse move ──
shell.addEventListener('mousemove', showTemp);

// ── Keyboard ──
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();togglePlay();}
  if(e.code==='ArrowRight'&&player)player.seekTo(player.getCurrentTime()+5,true);
  if(e.code==='ArrowLeft' &&player)player.seekTo(Math.max(0,player.getCurrentTime()-5),true);
  if(e.code==='ArrowUp'   &&player){player.setVolume(Math.min(100,player.getVolume()+10));vsl.value=player.getVolume();updVol();}
  if(e.code==='ArrowDown' &&player){player.setVolume(Math.max(0,player.getVolume()-10)); vsl.value=player.getVolume();updVol();}
  if(e.code==='KeyF')$('bFs').click();
  if(e.code==='KeyM')$('bMute').click();
});
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
